# Push a tag (v0.1.0) to build and push the multi-arch image to this Gitea's
# container registry. Needs secret PACKAGES_TOKEN: a token with write:package.
on:
  push:
    tags: ['v*']

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - run: echo "REGISTRY=${GITHUB_SERVER_URL#*://}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."${{ env.REGISTRY }}"]
              http = ${{ startsWith(github.server_url, 'http://') }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PACKAGES_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/farstu-client:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/farstu-client:latest
