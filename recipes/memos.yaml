app: memos
match: { images: ["neosmemo/memos", "ghcr.io/usememos/memos"] }
upstream_port: 5230
# The first account to sign up becomes admin. admin is null until then
# (memos 0.26 and later).
setup_done: { path: /api/v1/instance/profile, field: admin }
login:
  - { method: POST, path: /memos.api.v1.AuthService/SignIn } # the web app (Connect)
  - { method: POST, path: /api/v1/auth/signin }
